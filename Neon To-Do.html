<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Cass'To-Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rubik:wght@400;500;600&display=swap">
<style>
  /* Layout: one centred column, glowing logo header over a single bordered card of tasks. */
  :root {
    --bg: #07040f;
    --panel: #100a1f;
    --raised: #190f31;
    --green: #39ff14;
    --pink: #ff2bd6;
    --cyan: #00f0ff;
    --yellow: #fcff3d;
    --orange: #ff8a00;
    --fg: #f4f0ff;
    --dim: #a094cc;
    --font-display: 'Orbitron', 'Arial Black', system-ui, sans-serif;
    --font-body: 'Rubik', 'Segoe UI', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background:
      radial-gradient(circle at 15% 8%, rgba(255,43,214,.20), transparent 40%),
      radial-gradient(circle at 85% 18%, rgba(0,240,255,.17), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(57,255,20,.15), transparent 45%),
      var(--bg);
    color: var(--fg);
    font: 16px/1.4 var(--font-body);
    min-height: 100%;
    padding-block: 28px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
  .app { max-width: 680px; margin: 0 auto; }

  .header { display: flex; align-items: center; gap: 18px; margin-bottom: 26px; }
  .logo {
    flex: none; width: 92px; height: 92px; border-radius: 50%;
    border: 3px solid var(--green);
    box-shadow: 0 0 8px rgba(57,255,20,.7), 0 0 22px rgba(57,255,20,.5), 0 0 48px rgba(57,255,20,.25);
    animation: spin 24s linear infinite;
  }
  h1 {
    margin: 0; font: 900 clamp(1.7rem, 7vw, 2.9rem)/1 var(--font-display);
    letter-spacing: .04em; text-transform: uppercase; text-wrap: balance;
    color: var(--pink);
    text-shadow: 0 0 4px rgba(255,43,214,.9), 0 0 14px rgba(255,43,214,.7), 0 0 34px rgba(255,43,214,.45);
  }
  h1 span {
    color: var(--green);
    text-shadow: 0 0 4px rgba(57,255,20,.9), 0 0 14px rgba(57,255,20,.7), 0 0 34px rgba(57,255,20,.45);
  }
  .sub { margin: 10px 0 0; color: var(--cyan); letter-spacing: .08em; text-shadow: 0 0 8px rgba(0,240,255,.7); }

  .card {
    background: rgba(16,10,31,.88); border: 2px solid var(--cyan); border-radius: 22px; padding: 18px;
    box-shadow: 0 0 7px rgba(0,240,255,.55), 0 0 16px rgba(0,240,255,.45), 0 0 40px rgba(0,240,255,.22);
  }
  .form { display: flex; gap: 10px; }
  .form input {
    flex: 1; min-width: 0; padding: 13px 15px; background: var(--bg);
    border: 2px solid var(--pink); border-radius: 14px; font-size: 1.05rem;
  }
  .form input::placeholder { color: var(--dim); }
  .form input:focus { outline: none; border-color: var(--yellow); box-shadow: 0 0 6px rgba(252,255,61,.6), 0 0 18px rgba(252,255,61,.4); }
  .add {
    padding: 0 22px; background: transparent; border: 2px solid var(--green); border-radius: 14px;
    color: var(--green); font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    box-shadow: 0 0 6px rgba(57,255,20,.55), 0 0 16px rgba(57,255,20,.35);
    transition: background .2s, color .2s;
  }
  .add:hover:not(:disabled), .add:focus-visible { background: var(--green); color: var(--bg); }
  .add:disabled { opacity: .4; box-shadow: none; cursor: not-allowed; }

  .list { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 10px; }
  .item {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    background: var(--raised); border: 2px solid rgba(255,138,0,.85); border-radius: 14px;
    box-shadow: 0 0 5px rgba(255,138,0,.5), 0 0 12px rgba(255,138,0,.3);
    transition: box-shadow .25s, border-color .25s;
  }
  .item:hover { box-shadow: 0 0 7px rgba(255,138,0,.7), 0 0 20px rgba(255,138,0,.45); }
  .item.done { border-color: rgba(57,255,20,.7); box-shadow: 0 0 5px rgba(57,255,20,.5), 0 0 12px rgba(57,255,20,.25); }
  .item.done .text { text-decoration: line-through; text-decoration-color: var(--pink); color: var(--dim); }
  .check {
    flex: none; width: 28px; height: 28px; display: grid; place-items: center;
    background: transparent; border: 2px solid var(--cyan); border-radius: 8px;
    color: var(--bg); font-weight: 900;
  }
  .item.done .check { background: var(--green); border-color: var(--green); box-shadow: 0 0 10px rgba(57,255,20,.8); }
  .text { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 1.05rem; }
  .edit {
    flex: 1; min-width: 0; padding: 4px 8px; background: var(--bg);
    border: 2px solid var(--yellow); border-radius: 8px; font-size: 1.05rem;
  }
  .edit:focus { outline: none; box-shadow: 0 0 10px rgba(252,255,61,.6); }
  .icon {
    flex: none; width: 32px; height: 32px; display: grid; place-items: center;
    background: transparent; border: 2px solid transparent; border-radius: 8px; transition: box-shadow .2s, border-color .2s;
  }
  .icon.pen { color: var(--cyan); }
  .icon.pen:hover { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,.6); }
  .icon.del { color: var(--pink); }
  .icon.del:hover { border-color: var(--pink); box-shadow: 0 0 10px rgba(255,43,214,.6); }
  .empty { margin: 28px 0 8px; text-align: center; color: var(--dim); font-size: 1.05rem; }

  .footer {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 18px; padding-top: 16px; border-top: 1px dashed rgba(0,240,255,.5);
  }
  .count { color: var(--yellow); font-weight: 600; text-shadow: 0 0 8px rgba(252,255,61,.6); font-variant-numeric: tabular-nums; }
  .filters { display: flex; gap: 6px; }
  .pill {
    padding: 5px 14px; background: transparent; border: 2px solid var(--pink); border-radius: 999px;
    color: var(--pink); font-weight: 500; transition: background .2s, color .2s, box-shadow .2s;
  }
  .pill:hover { box-shadow: 0 0 10px rgba(255,43,214,.6); }
  .pill.active { background: var(--pink); color: var(--bg); box-shadow: 0 0 12px rgba(255,43,214,.7); }
  .pill.clear { border-color: var(--orange); color: var(--orange); }
  .pill.clear:hover:not(:disabled) { background: var(--orange); color: var(--bg); box-shadow: 0 0 12px rgba(255,138,0,.7); }
  .pill:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .note { margin: 16px 0 0; text-align: center; font-size: .85rem; color: var(--dim); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 480px) {
    .logo { width: 72px; height: 72px; }
    .footer { justify-content: center; }
  }
</style>

  const KEY = 'neon-todo:items';
  const EXAMPLES = [
    { id: 'e1', text: 'Try double-clicking a task to edit it', done: false },
    { id: 'e2', text: 'Tick this one off', done: true },
    { id: 'e3', text: 'Add your own task above', done: false }
  ];

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return EXAMPLES.map(t => ({ ...t }));
  }

  const { createApp, ref, computed, watch, nextTick } = Vue;

  createApp({
    setup() {
      const todos = ref(load());
      const filter = ref('all');
      const draft = ref('');
      const editingId = ref(null);
      const editText = ref('');
      const filters = [
        { value: 'all', label: 'All' },
        { value: 'active', label: 'Active' },
        { value: 'done', label: 'Done' }
      ];

      watch(todos, v => {
        try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {}
      }, { deep: true });

      const visible = computed(() => {
        if (filter.value === 'active') return todos.value.filter(t => !t.done);
        if (filter.value === 'done') return todos.value.filter(t => t.done);
        return todos.value;
      });
      const remaining = computed(() => todos.value.filter(t => !t.done).length);
      const completed = computed(() => todos.value.length - remaining.value);

      function add() {
        const text = draft.value.trim();
        if (!text) return;
        todos.value.unshift({ id: String(Date.now()) + Math.random().toString(16).slice(2), text, done: false });
        draft.value = '';
      }
      function toggle(t) { t.done = !t.done; }
      function remove(id) { todos.value = todos.value.filter(t => t.id !== id); }
      function clearDone() { todos.value = todos.value.filter(t => !t.done); }
      async function startEdit(t) {
        editingId.value = t.id;
        editText.value = t.text;
        await nextTick();
        const el = document.getElementById('edit-' + t.id);
        if (el) el.focus();
      }
      function commit(t) {
        if (editingId.value !== t.id) return;
        editingId.value = null;
        const text = editText.value.trim();
        if (!text) remove(t.id); else t.text = text;
      }
      function cancel() { editingId.value = null; }

      return { LOGO, todos, filter, filters, draft, visible, remaining, completed, editingId, editText,
               add, toggle, remove, clearDone, startEdit, commit, cancel };
    },
    template: `
      <main class="app">
        <header class="header">
          <img class="logo" :src="LOGO" alt="Neon green peace sign logo" width="92" height="92">
          <div>
            <h1>Neon <span>To-Do</span></h1>
            <p class="sub" v-if="todos.length">{{ remaining }} of {{ todos.length }} tasks left</p>
            <p class="sub" v-else>Peace, love &amp; productivity</p>
          </div>
        </header>

        <section class="card">
          <form class="form" @submit.prevent="add">
            <input id="new-task" v-model="draft" type="text" placeholder="What needs doing?" aria-label="New task" maxlength="120" autocomplete="off">
            <button class="add" type="submit" :disabled="!draft.trim()">Add</button>
          </form>

          <ul class="list" v-if="visible.length">
            <li v-for="t in visible" :key="t.id" class="item" :class="{ done: t.done }">
              <button class="check" type="button" role="checkbox" :aria-checked="t.done"
                      :aria-label="'Mark ' + t.text + (t.done ? ' as not done' : ' as done')" @click="toggle(t)">
                <span v-if="t.done">&#10003;</span>
              </button>
              <input v-if="editingId === t.id" :id="'edit-' + t.id" class="edit" v-model="editText" maxlength="120"
                     aria-label="Edit task" @keydown.enter="commit(t)" @keydown.esc="cancel" @blur="commit(t)">
              <span v-else class="text" title="Double-click to edit" @dblclick="startEdit(t)">{{ t.text }}</span>
              <button class="icon pen" type="button" aria-label="Edit task" @click="startEdit(t)">&#9998;</button>
              <button class="icon del" type="button" aria-label="Delete task" @click="remove(t.id)">&#10005;</button>
            </li>
          </ul>
          <p class="empty" v-else>{{ todos.length ? 'Nothing here. Try another filter.' : 'All clear. Add your first task.' }}</p>

          <footer class="footer" v-if="todos.length">
            <span class="count">{{ remaining }} left</span>
            <div class="filters" role="group" aria-label="Filter tasks">
              <button v-for="f in filters" :key="f.value" type="button" class="pill"
                      :class="{ active: filter === f.value }" :aria-pressed="filter === f.value" @click="filter = f.value">{{ f.label }}</button>
            </div>
            <button class="pill clear" type="button" :disabled="!completed" @click="clearDone">Clear done</button>
          </footer>
        </section>
        <p class="note">Preview of the Vue + Vite + TypeScript + Sass project. The three starter tasks are examples.</p>
      </main>`
  }).mount('#app');
</script>

</body></html>
